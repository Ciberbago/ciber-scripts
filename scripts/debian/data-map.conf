# data-map.conf — que se respalda de cada stack. Lo leen bin/backup y bin/restore.
#
# POLARIDAD: todo se respalda salvo lo que este listado aqui. Un stack sin linea
# entra al backup solo, sin editar nada. Para que un stack NO se respalde hay que
# escribirlo, no acordarse de escribirlo.
#
# Antes pasaba al reves: el script llevaba una lista de --exclude, y ahi se pudrearon.
# Las entradas de stacks que ya no existen (ytmt, wikipedia) no hacian nada, y un
# stack nuevo no se respaldaba hasta que alguien se acordara. Peor: un --exclude mal
# puesto se comia el archivo que si importaba. El de jelly/data/data/data se llevo
# por delante jellyfin.db, que es la base de configuracion, durante meses.
#
# Formato, campos separados por 2+ espacios (asi el campo `nota` puede llevar espacios):
#
#   stack  datos  incluye  excluye  snapshot  nota
#
#   datos       Ruta a respaldar, relativa a /opt/docker/<stack>/. OFF = no se respalda.
#               Por defecto es data/.
#   incluye     Globs DENTRO de `datos`, separados por espacio. Vacio = el arbol
#               entero. Con valor = solo esos.
#   excluye     Globs DENTRO de `datos`, igual. Se aplica siempre.
#   snapshot    SQLite a respaldar con la API de backup consistente en vez de copiar
#               el archivo. Ver bin/backup, seccion SNAPSHOT. Relativo al STACK.
#   nota        Para el humano que lea esto en 6 meses.
#
# OJO, la diferencia, que es facil colar: `incluye` y `excluye` van relativos a
# `datos` (jdown2 pone `logs/`, no `data/logs`), mientras que `snapshot` va relativo
# al stack (homeassistant pone `data/home-assistant_v2.db`). Si se mezclan, el
# respaldo sale mal y sin decir nada: un --exclude que no casa con nada no da error.
#
# REGLA DURA: una base de datos NUNCA va en `excluye`. Sin su -wal, un SQLite en modo
# WAL pierde las ultimas transacciones al restaurar, y no da ningun aviso. Para
# dejar fuera una base usa OFF, que se lee de un vistazo.

# ─── Sin respaldo, y a proposito ───────────────────────────────────────────────
# Los datos de estos no valen un byte: se regeneran solos, o no sirven para nada en
# un equipo nuevo. Si alguno cambia de opinion, se borra la linea.
#
uptime          OFF  -  -  -  -   stats: solo avisa incidencias, no restaura nada
webtop          OFF  -  -  -  -   DE efimero, 7.3G de navegador que se tira
navi            OFF  -  -  -  -   excluido antes de existir este manifiesto
torrent         OFF  -  -  -  -   excluido antes de existir este manifiesto
scrutiny        OFF  -  -  -  -   excluido antes de existir este manifiesto
metube          OFF  -  -  -  -   SIN almacenamiento persistente: su BD vive en la
                                     capa del contenedor y se pierde al recrearlo.
                                     Consecuencia aceptada, no es un descuido.
samba           OFF  -  -  -  -   solo monta /media/hdd, no guarda estado propio
redlib          OFF  -  -  -  -   sin estado; es un proxy de Reddit
cfddnsupdater   OFF  -  -  -  -   sin estado
cup             OFF  -  -  -  -   su cup.json es config y ya esta en git
glances         OFF  -  -  -  -   sin estado
honeygain       OFF  -  -  -  -   credenciales por env, sin estado
packetstream    OFF  -  -  -  -   sin estado
pawns           OFF  -  -  -  -   credenciales por env, sin estado
porkbun-ddns    OFF  -  -  -  -   credenciales por env, sin estado
repocket        OFF  -  -  -  -   token por env, sin estado
ttyd            OFF  -  -  -  -   sin estado

# ─── Seleccion quirurgica: solo lo que no se regenera ──────────────────────────

# jelly: 1.2G en total; 34M son config real y el resto es cache que Jellyfin
# reconstruye escaneando. OJO con el anidado data/data/data, ver jelly/README.md.
# jellyfin.db entra por `snapshot`, no por `incluye`: es la unica razon de que este
# stack estuviera sin respaldar su base durante meses.
jelly  data/  *.xml logging.default.json users/ dlna/ data/plugins/configurations/  -  data/data/data/jellyfin.db  bibliotecas, usuarios, historial, plugins. Sin metadata/ (825M) habra que re-escanear al restaurar

# jdown2: el tema oscuro NO esta en cfg/. Esta en libs/laf/syntheticaBlackEye.jar;
# cfg/ solo lo selecciona con "lookandfeeltheme":"BLACK_EYE". Por eso el arbol
# entero: respaldar solo cfg/ dejaria el config apuntando a un jar que no se copio.
jdown2  data/  -  logs/ log/ tmp/ translations/  -  el tema vive en libs/laf/, no en cfg/

# wolweb: unico estado de runtime, 149 B con MACs e IPs. config.json es de la
# imagen de 2021 y el compose lo pisa con variables de entorno. Ver FASE 4: el
# bind es de un solo archivo, y hay que sembrarlo antes o Docker crea un dir.
wolweb  data/  devices.json  -  -  1 archivo

# ─── Rutas de datos que no son data/ ───────────────────────────────────────────

# nextexplorer monta ./config, no ./data. app-config.json es config legible y
# sigue en git; app.db es la base viva y va con snapshot. ./cache se regenera.
nextexplorer  config/  -  -  config/app.db  app-config.json en git, app.db con snapshot

# microbin: todavia se llama microbin_data. La FASE 4 lo renombra a data/ y
# cambia esta linea en el mismo commit; si divergen, el backup no ve microbin.
microbin  data/  -  -  -  pastes; se respaldan enteros, son pocos KB

# ─── Snapshot consistente de SQLite ─────────────────────────────────────────────
# Copiar un .db mientras el contenedor escribe dessus produce un archivo que a
# veces abre y a veces no. Por eso van aqui, no en la lista normal: bin/backup
# los saca con la API de backup de SQLite, que produce un .db unico y ya
# checkpointeado, sin -wal ni -shm que acompanar.
homeassistant  data/  -  -  data/home-assistant_v2.db  224M, WAL, la que fallaba
komga          data/  -  -  data/database.sqlite  32M

# ─── Con nota pero sin nada especial ───────────────────────────────────────────
# wg-easy: contiene las claves privadas de WireGuard. Si se pierde, el VPN hay
# que rehacerlo y volver a repartir claves a todos los dispositivos.
wg-easy  data/  -  -  -  claves privadas de WireGuard
