---
# Archivos con secretos que el sistema necesita pero que NO pueden vivir en el
# repo. El rol los crea con valores de ejemplo y avisa mientras sigan asi.
#
# El caso que lo motivo es el montaje del NAS: la unidad apunta a
# /home/jaime/.credentials, ese archivo no existia en una maquina recien
# instalada, y el fallo era completamente mudo. Ni el playbook ni el arranque
# decian nada; el NAS simplemente no aparecia.
#
# Este rol NO falla si las credenciales siguen sin rellenar. Es lo esperado en
# una instalacion nueva, y hacer fallar el playbook por eso obligaria a
# rellenarlas antes de poder terminar de configurar la maquina.

- name: Crear los archivos de credenciales que falten
  # 'force: false' es lo importante de esta tarea: si el archivo ya existe no se
  # toca. Sin eso, cada 'ciber-apply' borraria la contrasena real y la
  # reemplazaria por CAMBIAME.
  ansible.builtin.copy:
    content: "{{ item.contenido }}"
    dest: "{{ item.dest }}"
    mode: "0600"
    force: false
  loop: "{{ credential_files }}"
  loop_control:
    label: "{{ item.dest }}"
  become: false

- name: Ver si siguen con los valores de ejemplo
  # Se comprueba con 'grep -q', que no imprime nada: asi la contrasena real
  # nunca pasa por la salida de Ansible ni queda en el log. Leer el archivo con
  # slurp o lookup('file') si la expondria.
  ansible.builtin.command:
    cmd: "grep -q -- {{ credential_placeholder | quote }} {{ item.dest | quote }}"
  loop: "{{ credential_files }}"
  loop_control:
    label: "{{ item.dest }}"
  become: false
  register: cred_grep
  changed_when: false
  check_mode: false
  failed_when: false

- name: Revisar los permisos
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ credential_files }}"
  loop_control:
    label: "{{ item.dest }}"
  become: false
  register: cred_stat

- name: Apuntar cuales quedaron pendientes
  # Se guarda como fact para que el resumen final de site.yml lo repita. Un
  # aviso a la mitad de una corrida de 8 minutos no lo ve nadie.
  ansible.builtin.set_fact:
    # El 'default([])' no sobra: con credential_files vacia, Ansible marca la
    # tarea como saltada y el registro NO trae la clave 'results'.
    credenciales_pendientes: >-
      {{ cred_grep.results | default([]) | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
    credenciales_permisos_laxos: >-
      {{ cred_stat.results | default([]) | selectattr('stat.exists')
         | rejectattr('stat.mode', 'equalto', '0600')
         | map(attribute='item') | list }}

- name: AVISO - credenciales sin rellenar
  ansible.builtin.debug:
    msg: >-
      {{ item.desc }}: falta poner los datos reales en {{ item.dest }}
      (ahora tiene {{ credential_placeholder }}).
      {{ item.pista | default('') }}
  loop: "{{ credenciales_pendientes }}"
  loop_control:
    label: "{{ item.dest }}"
  when: credenciales_pendientes | length > 0

- name: AVISO - permisos demasiado abiertos
  # Son contrasenas en texto plano. 0600 no es cosmetico.
  ansible.builtin.debug:
    msg: >-
      {{ item.dest }} deberia ser 0600. Corrigelo con: chmod 600 {{ item.dest }}
  loop: "{{ credenciales_permisos_laxos }}"
  loop_control:
    label: "{{ item.dest }}"
  when: credenciales_permisos_laxos | length > 0
