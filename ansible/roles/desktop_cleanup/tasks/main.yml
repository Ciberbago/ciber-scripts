---
# Ocultar lanzadores y quitar paquetes no deseados.

- name: Quitar paquetes no deseados
  # En bash un solo 'pacman -Runs vlc python-pip python-poetry' fallaba completo
  # si UNO de los tres no estaba instalado. El modulo maneja eso solo.
  community.general.pacman:
    name: "{{ pacman_remove }}"
    state: absent
    extra_args: --recursive --unneeded
  become: true

- name: Buscar huerfanos
  # El modulo pacman no tiene concepto de huerfano, asi que se consultan aparte
  ansible.builtin.command:
    cmd: pacman -Qdtq
  register: huerfanos
  changed_when: false
  failed_when: false

- name: Quitar huerfanos
  # 'pacman -Qdtq | pacman -Runs -' devolvia error cuando la lista salia vacia
  # ("no targets specified"). Aqui la tarea simplemente se omite.
  community.general.pacman:
    name: "{{ huerfanos.stdout_lines }}"
    state: absent
    extra_args: --recursive --unneeded
  become: true
  when: huerfanos.stdout_lines | length > 0

- name: Crear /usr/local/share/applications
  ansible.builtin.file:
    path: /usr/local/share/applications
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ver que lanzadores existen
  ansible.builtin.stat:
    path: "/usr/share/applications/{{ item }}.desktop"
  loop: "{{ gnome_hide_apps }}"
  register: desktop_stat

- name: Copiar los lanzadores a /usr/local/share
  # Se copia en lugar de editar /usr/share porque pacman sobrescribe /usr/share
  # en cada actualizacion del paquete.
  ansible.builtin.copy:
    src: "/usr/share/applications/{{ item.item }}.desktop"
    dest: "/usr/local/share/applications/{{ item.item }}.desktop"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false     # no sobrescribir si ya lo editamos
  loop: "{{ desktop_stat.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  become: true

- name: Marcar los lanzadores como ocultos
  # En bash era 'sed -i "$ a Hidden=true" .../applications/*', que agregaba la
  # linea A TODOS los archivos en CADA corrida: al segundo run quedaban dos
  # Hidden=true, al tercero tres. lineinfile es idempotente.
  ansible.builtin.lineinfile:
    path: "/usr/local/share/applications/{{ item.item }}.desktop"
    regexp: '^Hidden='
    line: "Hidden=true"
    insertafter: EOF
  loop: "{{ desktop_stat.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  notify: Actualizar base de datos de lanzadores

- name: Avisar de lanzadores que no existen
  ansible.builtin.debug:
    msg: >-
      No instalados, se omitieron:
      {{ desktop_stat.results | rejectattr('stat.exists')
         | map(attribute='item') | list | join(', ') }}
  when: desktop_stat.results | rejectattr('stat.exists') | list | length > 0
