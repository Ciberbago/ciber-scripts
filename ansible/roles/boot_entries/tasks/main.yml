---
# Entradas de systemd-boot, una por kernel instalado.
#
# Este rol existe aparte de system_files por una razon de ORDEN: descubre los
# kernels de /boot, asi que tiene que correr DESPUES de que se instalen todos.
# Cuando el bloque vivia en system_files (que va antes de 'aur'), en una maquina
# limpia linux-cachyos todavia no estaba instalado: solo se generaba la entrada
# de linux-lts, y loader.conf quedaba con "default ciber-linux-cachyos.conf"
# apuntando a una entrada inexistente. Hacia falta una segunda corrida.

# --- Entradas de systemd-boot ---
#
# Se genera UNA ENTRADA POR KERNEL INSTALADO, descubriendolos de /boot/vmlinuz-*.
# Antes habia una plantilla escrita a mano por kernel (cachyos.conf.j2,
# lts.conf.j2), lo cual significaba que agregar un kernel a packages.yml exigia
# escribir tambien un archivo nuevo. Ahora no: instala el kernel y su entrada
# aparece sola; quitalo y su entrada se borra.

- name: Entradas de systemd-boot
  when: boot_entries_enabled
  block:
    - name: Exigir una entrada default declarada
      # Sin 'default' en loader.conf, systemd-boot elige por orden de sorteo, y
      # agregar entradas cambiaria en silencio con que kernel arrancas.
      ansible.builtin.assert:
        that: boot_default_entry | length > 0
        fail_msg: >-
          boot_entries_enabled es true pero boot_default_entry esta vacio.
          Pon el id de una entrada que sepas que arranca ('bootctl list').
        quiet: true

    - name: Comprobar que existe /boot/loader/entries
      ansible.builtin.stat:
        path: /boot/loader/entries
      register: entries_dir
      become: true

    - name: Avisar si no hay carpeta de entradas
      ansible.builtin.debug:
        msg: >-
          /boot/loader/entries no existe: se omiten las entradas. Si tu ESP no
          esta montada en /boot, esta parte hay que ajustarla.
      when: not entries_dir.stat.exists

    - name: Generar las entradas
      when: entries_dir.stat.exists
      block:
        - name: Detectar el dispositivo de la particion root
          ansible.builtin.command:
            cmd: findmnt --noheadings --output SOURCE --target /
          register: root_source
          changed_when: false
          check_mode: false

        - name: Detectar el PARTUUID de root
          ansible.builtin.command:
            cmd: "blkid -s PARTUUID -o value {{ root_source.stdout | trim }}"
          register: root_partuuid
          changed_when: false
          check_mode: false
          become: true

        - name: Detectar el sistema de archivos de root
          ansible.builtin.command:
            cmd: findmnt --noheadings --output FSTYPE --target /
          register: root_fstype
          changed_when: false
          check_mode: false

        - name: Buscar la imagen de microcodigo del CPU
          ansible.builtin.find:
            paths: /boot
            patterns: "*-ucode.img"
            recurse: false
          register: ucode_img
          become: true

        - name: Guardar los datos de root y microcodigo
          ansible.builtin.set_fact:
            ciber_root_partuuid: "{{ root_partuuid.stdout | trim }}"
            ciber_root_fstype: "{{ root_fstype.stdout | trim }}"
            ciber_ucode_initrd: >-
              {{ ucode_img.files | map(attribute='path') | map('basename')
                 | sort | first | default('', true) }}

        - name: Comprobar que se detecto lo necesario
          ansible.builtin.assert:
            that:
              - ciber_root_partuuid | length > 0
              - ciber_root_fstype | length > 0
            fail_msg: >-
              No se pudo detectar el PARTUUID o el fstype de root
              ({{ root_source.stdout | trim }}). Si tu root esta en LVM o LUKS,
              escribe las entradas a mano y pon boot_entries_enabled en false.
            quiet: true

        - name: Descubrir los kernels instalados
          ansible.builtin.find:
            paths: /boot
            patterns: "vmlinuz-*"
            file_type: file
            recurse: false
          register: kernel_images
          become: true

        - name: Ver cuales tienen initramfs clasico
          ansible.builtin.stat:
            path: "/boot/initramfs-{{ item }}.img"
          loop: >-
            {{ kernel_images.files | map(attribute='path') | map('basename')
               | map('regex_replace', '^vmlinuz-', '') | sort | list }}
          register: initramfs_stat
          become: true

        - name: Fijar la lista de kernels con entrada propia
          # Un kernel SIN initramfs-<nombre>.img esta empaquetado como UKI:
          # systemd-boot ya lo encuentra solo como entrada Type #2, y escribirle
          # una Type #1 lo duplicaria en el menu.
          ansible.builtin.set_fact:
            boot_kernels: >-
              {{ initramfs_stat.results | selectattr('stat.exists')
                 | map(attribute='item') | list }}
            boot_kernels_uki: >-
              {{ initramfs_stat.results | rejectattr('stat.exists')
                 | map(attribute='item') | list }}

        - name: Mostrar lo detectado
          ansible.builtin.debug:
            msg:
              partuuid: "{{ ciber_root_partuuid }}"
              fstype: "{{ ciber_root_fstype }}"
              microcodigo: "{{ ciber_ucode_initrd | default('(ninguno)', true) }}"
              con_entrada: "{{ boot_kernels }}"
              son_uki_se_omiten: "{{ boot_kernels_uki }}"

        - name: Fijar la entrada default de systemd-boot
          ansible.builtin.lineinfile:
            path: /boot/loader/loader.conf
            regexp: '^#?\s*default\s'
            line: "default {{ boot_default_entry }}"
            insertbefore: BOF
          become: true

        - name: Escribir una entrada por kernel
          ansible.builtin.template:
            src: entry.conf.j2
            dest: "/boot/loader/entries/ciber-{{ item }}.conf"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ boot_kernels }}"
          become: true

        - name: Buscar entradas nuestras ya existentes
          ansible.builtin.find:
            paths: /boot/loader/entries
            patterns: "ciber-*.conf"
          register: entradas_nuestras
          become: true

        - name: Quitar entradas de kernels que ya no estan
          # Solo se tocan las que empiezan con "ciber-": las de archinstall o las
          # que hayas puesto a mano nunca se borran.
          ansible.builtin.file:
            path: "/boot/loader/entries/{{ item }}"
            state: absent
          loop: >-
            {{ entradas_nuestras.files | map(attribute='path') | map('basename') | list
               | difference(boot_kernels | map('regex_replace', '^', 'ciber-')
                                         | map('regex_replace', '$', '.conf') | list) }}
          become: true
