---
# Docker desde el repo APT oficial.
#
# El script de bash hacia 'curl -fsSL https://get.docker.com | sudo sh'. Eso
# funciona, pero deja Docker fuera del ciclo normal de actualizaciones: 'apt
# upgrade' no lo toca y hay que volver a correr el curl a mano. Con el repo
# oficial, Docker se actualiza como cualquier otro paquete.
#
# Ademas, el script de conveniencia se descarga y se ejecuta con sudo en cada
# corrida, sin verificar nada. Aqui la llave se instala una vez y apt verifica
# la firma de cada paquete contra ella.

- name: Instalar la llave GPG de Docker
  # get_url y no 'apt_key': apt-key esta eliminado en Debian 12. La llave de
  # Docker se publica en ASCII armored, asi que se guarda como .asc y se
  # referencia tal cual desde signed-by=. No hace falta desarmarla con gpg.
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_keyring }}"
    owner: root
    group: root
    # 0644 y no 0600: apt corre como _apt (usuario sin privilegios) al
    # descargar, y si no puede leer la llave falla con "signature couldn't be
    # verified". Es el error mas comun al seguir esta guia a medias.
    mode: "0644"
  become: true

- name: Ver si la fuente de Docker tiene alguna linea que no sea la nuestra
  # get.docker.com deja /etc/apt/sources.list.d/docker.list apuntando al MISMO source
  # pero con signed-by=/etc/apt/keyrings/docker.gpg, en formato binario. Eso es
  # exactamente lo que hay que retirar antes de escribir la nuestra.
  #
  # 'grep -v' imprime las lineas que NO son la nuestra, asi que cualquier salida es
  # linea ajena. Se mira eso y no "esta el fichero bien?" porque el fallo de apt es
  # el de TENER una linea ajena, no el de faltar la nuestra: un fichero con las dos
  # lineas -- la vieja y la que acaba de anadir el modulo -- ya esta roto, y por eso
  # un "si contiene la nuestra, no lo toco" lo dejaria roto.
  ansible.builtin.shell: |
    grep -vF 'signed-by={{ docker_keyring }}' /etc/apt/sources.list.d/docker.list || true
  register: docker_lineas_ajenas
  changed_when: false
  failed_when: false
  become: true

- name: Quitar la fuente heredada de Docker si contradice la nueva
  # ESTA ES LA TAREA QUE ARREGLA EL CONFLICTO.
  #
  # Medido el 2026-09-28 en un servidor que ya traia Docker de get.docker.com: el
  # fichero *.list se quedaba con DOS lineas para el mismo source, una con
  # signed-by=docker.gpg y la otra con signed-by=docker.asc, y apt respondia
  #
  #     E:Conflicting values set for option Signed-By regarding source
  #     https://download.docker.com/linux/debian/ bookworm:
  #     /etc/apt/keyrings/docker.gpg != /etc/apt/keyrings/docker.asc
  #     E:The list of sources could not be read.
  #
  # Que no es solo que falle Docker. 'apt update' deja de poder LEER la lista de
  # fuentes, asi que se cae el indice completo y con el cualquier 'apt install' de
  # cualquier paquete falla. Y el mensaje no dice nada de 'signed-by', asi que sin
  # este comentario el siguiente que lo vea pierde el rato igual.
  #
  # El criterio es que no quede ninguna linea ajena, de forma que la segunda corrida
  # se queda verde en vez de borrar y recrear la fuente en cada apply: ese es el
  # criterio de este repo, 'la segunda corrida sale verde'.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: docker_lineas_ajenas.stdout | length > 0
  become: true

- name: Quitar la llave .gpg que dejo get.docker.com, ya sin uso
  # Se va con la fuente heredada: sin linea que la referencie, un keyring suelto en
  # /etc/apt/keyrings no hace nada, pero confunde al que lea el directorio.
  ansible.builtin.file:
    path: "{{ apt_keyrings_dir }}/docker.gpg"
    state: absent
  become: true

- name: Agregar el repo de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_deb_arch }} signed-by={{ docker_keyring }}]
      {{ docker_repo_url }} {{ ciber_debian_codename }} stable
    filename: docker
    state: present
    update_cache: true
  become: true

- name: Que sigue - Docker
  ansible.builtin.debug:
    msg:
      sigue: "Instalar Docker Engine, containerd y los plugins buildx/compose"
      tarda: "~1-2 min, dependiendo de la conexion (~120 MB)"

- name: Instalar Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  become: true

# El servicio se habilita y arranca desde systemd.yml (systemd_units_enabled /
# systemd_units_started), no aqui: asi toda la gestion de unidades vive en un
# solo lugar y se ve de un vistazo que arranca en boot.

# El repo de stacks (/opt/docker) YA NO SE CLONA AQUI. Es un paso manual aparte,
# documentado en docs/nuevo-servidor.md, y con razon:
#
#   - Es otro repositorio, con su propio ciclo de vida. Un playbook que deja de
#     funcionar porque un repo privado no se pudo clonar no cumple su trabajo.
#   - Este playbook se aplica a un servidor Debian limpio que todavia no tiene nada
#     de esto. QueClone de servicios ahi es mezclar dos pasos
#     que el usuario quiere ver por separado.
#   - 'failed_when: false' sobre el clon de un repo PRIVADO es el peor de los dos
#     mundos: si no hay credenciales, git falla, la tarea se traga el error y el
#     servidor queda con /opt/docker vacio sin mas aviso que una linea de debug.
#     Un fallo mudo en la etapa de recuperacion de desastres es exactamente lo que
#     no debe pasar.
#
# Lo que si sigue haciendo este rol: instalar Docker Engine, containerd y los
# plugins buildx/compose desde el repo APT oficial, que es su trabajo de verdad.
