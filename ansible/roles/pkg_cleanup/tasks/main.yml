---
# Limpieza de huerfanos. Corre al FINAL del playbook a proposito: solo entonces
# se sabe que quedo realmente sin usar.
#
# La eliminacion de 'pacman_remove' NO vive aqui, sino al principio del rol
# 'packages'. Aqui corria demasiado tarde para el caso de reemplazar un paquete
# por otro que entra en conflicto con el.

- name: Buscar huerfanos
  # El modulo pacman no tiene concepto de huerfano, asi que se consultan aparte
  ansible.builtin.command:
    cmd: pacman -Qdtq
  register: huerfanos
  changed_when: false
  failed_when: false

- name: Que sigue - huerfanos
  ansible.builtin.debug:
    msg:
      sigue: "Quitar {{ huerfanos.stdout_lines | length }} paquetes huerfanos"
      cuales: "{{ huerfanos.stdout_lines }}"
  when: huerfanos.stdout_lines | length > 0

- name: Quitar huerfanos
  # 'pacman -Qdtq | pacman -Runs -' devolvia error cuando la lista salia vacia
  # ("no targets specified"). Aqui la tarea simplemente se omite.
  community.general.pacman:
    name: "{{ huerfanos.stdout_lines }}"
    state: absent
    extra_args: --recursive --unneeded
  become: true
  when: huerfanos.stdout_lines | length > 0
