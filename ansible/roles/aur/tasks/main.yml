---
# chaotic-aur (repo binario) + yay + los paquetes que si hay que compilar.
#
# Este es el rol mas delicado del playbook, por una razon estructural: makepkg se
# niega a correr como root, pero necesita sudo para instalar dependencias. Como
# ansible-pull no es una terminal interactiva, yay no puede pedir el password a
# medias. La solucion es un permiso NOPASSWD temporal, limitado a /usr/bin/pacman
# y a este usuario, que se retira siempre al final (bloque always) incluso si
# algo falla.

- name: Ver si la llave de chaotic ya esta en el keyring de pacman
  ansible.builtin.command:
    cmd: "pacman-key --list-keys {{ chaotic_key_id }}"
  register: chaotic_key_check
  changed_when: false
  check_mode: false
  failed_when: false
  become: true

- name: Importar y firmar la llave de chaotic-aur
  # No se usa community.general.pacman_key porque exige la huella COMPLETA de 40
  # caracteres y rechaza el ID corto de 16 que publica chaotic
  # ("key ID is not full-length"). El modulo tiene razon: los IDs cortos son
  # susceptibles a colisiones. Aqui se usan los dos comandos que documenta
  # chaotic, con guarda de idempotencia.
  #
  # MEJORA PENDIENTE: pinear la huella completa. Se obtiene con
  #   pacman-key --finger 3056513887B78AEB
  # y luego se puede volver a pacman_key con esa huella, que es mas seguro.
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "pacman-key --recv-key {{ chaotic_key_id }} --keyserver {{ chaotic_keyserver }}"
    - "pacman-key --lsign-key {{ chaotic_key_id }}"
  become: true
  when: chaotic_key_check.rc != 0
  changed_when: true

- name: Ver si el keyring y el mirrorlist de chaotic ya estan
  ansible.builtin.command:
    cmd: "pacman -Qq {{ item }}"
  loop:
    - chaotic-keyring
    - chaotic-mirrorlist
  register: chaotic_base
  changed_when: false
  check_mode: false
  failed_when: false

- name: Instalar keyring y mirrorlist de chaotic-aur
  # Se instalan por URL (pacman -U). La guarda de arriba evita reinstalarlos en
  # cada corrida: instalar por URL no es idempotente por si solo.
  community.general.pacman:
    name: "https://cdn-mirror.chaotic.cx/chaotic-aur/{{ item.item }}.pkg.tar.zst"
    state: present
  loop: "{{ chaotic_base.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  become: true

- name: Agregar el repo chaotic-aur a pacman.conf
  # En bash esto era 'tee -a', que duplicaba la seccion en cada corrida.
  # blockinfile usa marcadores, asi que reemplaza su propio bloque.
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} chaotic-aur (ansible)"
    block: |
      [chaotic-aur]
      Include = /etc/pacman.d/chaotic-mirrorlist
  become: true
  register: chaotic_repo

- name: Sincronizar bases despues de agregar chaotic-aur
  community.general.pacman:
    update_cache: true
  become: true
  when: chaotic_repo is changed

- name: Ver que paquetes de chaotic existen realmente
  # Sin esta comprobacion, UN nombre que ya no este en el repo tumba la
  # instalacion de los otros nueve. Ademas el error del modulo es enganoso:
  # cuando no resuelve el nombre en los repos cae a tratarlo como archivo local
  # (pacman --upgrade) y reporta "could not find or read package".
  ansible.builtin.command:
    cmd: "pacman -Si chaotic-aur/{{ item }}"
  loop: "{{ chaotic_packages }}"
  register: chaotic_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Que sigue - binarios de chaotic
  ansible.builtin.debug:
    msg:
      sigue: >-
        Instalar {{ chaotic_check.results | selectattr('rc', 'equalto', 0)
        | map(attribute='item') | list | length }} paquetes binarios de
        chaotic-aur (incluye el kernel linux-cachyos)
      tarda: "~2 min en limpio. Es descarga, no compilacion"
      avance: "ciber-watch en otra terminal"

- name: Instalar binarios de chaotic-aur
  # Son paquetes de un repo normal: los instala pacman sin compilar nada.
  #
  # UNA SOLA transaccion con toda la lista, no un loop por paquete. Se probo el
  # loop para ver avance en pantalla y fue un error: con ParallelDownloads = 20
  # en pacman.conf, una transaccion baja hasta 20 paquetes en paralelo, mientras
  # que N transacciones separadas bajan de uno en uno. Partirlo tiraba a la
  # basura esa optimizacion, y ademas pierde la resolucion conjunta de
  # dependencias.
  #
  # Para ver el avance dentro de esta tarea esta 'ciber-watch' en otra terminal,
  # que lee /var/log/pacman.log y da mas detalle que las lineas de Ansible.
  #
  # Se pasan los nombres SIN el prefijo "chaotic-aur/": el modulo interpreta un
  # nombre con "/" como ruta a un archivo y usa -U en lugar de -S.
  community.general.pacman:
    name: "{{ chaotic_check.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    state: present
  become: true
  when: chaotic_check.results | selectattr('rc', 'equalto', 0) | list | length > 0

- name: Avisar de paquetes que no estan en chaotic-aur
  ansible.builtin.debug:
    msg: >-
      No estan en chaotic-aur, se omitieron:
      {{ chaotic_check.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list | join(', ') }}.
      Si los necesitas, muevelos a aur_packages para que yay los compile.
  when: chaotic_check.results | rejectattr('rc', 'equalto', 0) | list | length > 0

# --- A partir de aqui, compilacion del AUR ---

- name: Ver si yay ya esta instalado
  ansible.builtin.command:
    cmd: pacman -Qq yay
  register: yay_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Ver que paquetes del AUR faltan
  ansible.builtin.command:
    cmd: "pacman -Qq {{ item }}"
  loop: "{{ aur_packages }}"
  register: aur_check
  changed_when: false
  check_mode: false
  failed_when: false

# --- PKGBUILDs propios (carpeta pkgbuilds/ del repo) ---
#
# Recetas de paquetes que no estan en el AUR. Se compilan con makepkg y quedan
# instalados como cualquier otro paquete: aparecen en 'pacman -Qm' igual que los
# del AUR, y pacman -Syu no los toca.
#
# Van en ESTE rol y dentro del mismo bloque que el AUR a proposito: makepkg
# necesita el permiso NOPASSWD temporal para instalar dependencias de
# compilacion, y ese permiso ya se pone y se retira aqui. Un rol aparte tendria
# que duplicar todo ese manejo.

- name: Comprobar que los PKGBUILD existen en el repo
  ansible.builtin.stat:
    path: "{{ ciber_repo_root }}/{{ local_packages_dir }}/{{ item }}/PKGBUILD"
  loop: "{{ local_packages }}"
  register: localpkg_stat
  become: false

- name: Fallar con la lista de PKGBUILD que faltan
  # Aqui SI se falla, a diferencia del AUR. Que un paquete del AUR desaparezca es
  # cosa de terceros y no debe tumbar la corrida; que falte un PKGBUILD del
  # propio repo es el repo contradiciendose, y se arregla en una linea.
  ansible.builtin.assert:
    that: localpkg_stat.results | default([]) | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Estan en local_packages pero no tienen PKGBUILD en {{ local_packages_dir }}/:
      {{ localpkg_stat.results | default([]) | rejectattr('stat.exists')
         | map(attribute='item') | list | join(', ') }}
    quiet: true

- name: Ver que paquetes locales hay que compilar
  # Compara la version declarada en el PKGBUILD contra la instalada: sale 0 si
  # coinciden (no hay nada que hacer) y distinto de 0 si hay que compilar. Asi
  # actualizar un paquete es subir pkgrel en el PKGBUILD y volver a aplicar.
  #
  # executable /bin/bash y no sh: los PKGBUILD usan arrays (depends=(), source=())
  # que solo existen en bash.
  #
  # OJO con los PKGBUILD tipo -git que definen pkgver(): ahi la version se calcula
  # al compilar, no al leer el archivo, asi que esta comparacion nunca dira "al
  # dia" y se recompilaran en cada corrida.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      cd {{ (ciber_repo_root ~ '/' ~ local_packages_dir ~ '/' ~ item) | quote }} || exit 1
      declarada=$(. ./PKGBUILD >/dev/null 2>&1; echo "$pkgver-$pkgrel")
      instalada=$(pacman -Q {{ item | quote }} 2>/dev/null | awk '{print $2}')
      echo "declarada=${declarada:-?} instalada=${instalada:-ninguna}"
      [ -n "$instalada" ] && [ "$declarada" = "$instalada" ]
  loop: "{{ local_packages }}"
  loop_control:
    label: "{{ item }}"
  register: localpkg_check
  changed_when: false
  check_mode: false
  failed_when: false
  become: false

- name: Compilar del AUR
  # El bloque tambien tiene que correr cuando lo unico pendiente son PKGBUILDs
  # del repo: son los que necesitan el permiso NOPASSWD que se pone aqui dentro.
  when: >-
    yay_check.rc != 0
    or (aur_check.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length > 0)
    or (localpkg_check.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length > 0)
  block:
    - name: Permitir pacman sin password temporalmente
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-ciber-aur
        content: "{{ ciber_user }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      become: true

    - name: Clonar yay
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay.git
        dest: /tmp/ciber-build-yay
        depth: 1
        version: master
      become: false
      when: yay_check.rc != 0

    - name: Que sigue - compilar yay
      ansible.builtin.debug:
        msg:
          sigue: "Compilar yay desde el AUR con makepkg"
          tarda: "~40 s. Aqui si es compilacion, no descarga"
      when: yay_check.rc != 0

    - name: Compilar e instalar yay
      # makepkg NO puede correr como root: become false a proposito.
      ansible.builtin.command:
        cmd: makepkg -si --noconfirm --needed
        chdir: /tmp/ciber-build-yay
      become: false
      when: yay_check.rc != 0
      changed_when: true

    - name: Que sigue - compilar del AUR
      ansible.builtin.debug:
        msg:
          sigue: >-
            Compilar del AUR con yay:
            {{ aur_check.results | rejectattr('rc', 'equalto', 0)
               | map(attribute='item') | list }}
          tarda: "Varios minutos. Los paquetes -git y los dkms son los lentos"
          avance: >-
            'ciber-watch' muestra los procesos de compilacion en curso cada 5 s
      # Sin este 'when' el banner salia con la lista vacia cuando lo unico
      # pendiente eran PKGBUILDs del repo, que tambien entran a este bloque.
      when: aur_check.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length > 0

    - name: Instalar paquetes del AUR con yay
      # No aborta el play si uno falla. Compilar el AUR toma minutos, y perder
      # una corrida entera (y las tareas que faltaban despues) por UN nombre de
      # paquete muerto no tiene sentido. Lo que falle se reporta abajo.
      ansible.builtin.command:
        cmd: "yay -S --needed --noconfirm --answerclean None --answerdiff None {{ item.item }}"
      become: false
      loop: "{{ aur_check.results | rejectattr('rc', 'equalto', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true
      failed_when: false
      register: yay_result

    - name: Reportar paquetes del AUR que fallaron
      ansible.builtin.debug:
        msg:
          fallaron: >-
            {{ yay_result.results | rejectattr('rc', 'equalto', 0)
               | map(attribute='item.item') | list }}
          que_hacer: >-
            Busca el nombre correcto con 'yay -Ss <termino>'. Si el paquete ya no
            existe, quitalo de aur_packages en packages.yml.
      when: yay_result.results | rejectattr('rc', 'equalto', 0) | list | length > 0

    # --- PKGBUILDs del repo ---

    - name: Que sigue - compilar PKGBUILDs del repo
      ansible.builtin.debug:
        msg:
          sigue: >-
            Compilar con makepkg:
            {{ localpkg_check.results | default([]) | rejectattr('rc', 'equalto', 0)
               | map(attribute='item') | list }}
          por_que: >-
            {{ localpkg_check.results | default([]) | rejectattr('rc', 'equalto', 0)
               | map(attribute='stdout') | map('trim') | list }}
      when: localpkg_check.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length > 0

    - name: Copiar los PKGBUILD a un directorio de compilacion
      # No se compila dentro del checkout: makepkg deja src/, pkg/ y el
      # .pkg.tar.zst en el directorio actual, y eso pelearia con el
      # 'git checkout -qf' con el que arranca cada corrida.
      ansible.builtin.copy:
        src: "{{ ciber_repo_root }}/{{ local_packages_dir }}/{{ item.item }}/"
        dest: "/tmp/ciber-pkg-{{ item.item }}/"
        remote_src: true
        mode: preserve
      loop: "{{ localpkg_check.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"
      become: false

    - name: Compilar e instalar los PKGBUILD del repo
      # -f sobrescribe un .pkg.tar.zst que haya quedado de una corrida
      # interrumpida, donde el 'always' de limpieza no alcanzo a ejecutarse. Sin
      # el, makepkg se niega a seguir con un error que no dice que sobra un
      # archivo viejo.
      #
      # become false: makepkg se niega a correr como root. Las dependencias las
      # instala con el NOPASSWD temporal de mas arriba.
      ansible.builtin.command:
        cmd: makepkg -sif --noconfirm --needed
        chdir: "/tmp/ciber-pkg-{{ item.item }}"
      loop: "{{ localpkg_check.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"
      become: false
      changed_when: true
      failed_when: false
      register: localpkg_build

    - name: Reportar PKGBUILDs que fallaron
      ansible.builtin.debug:
        msg:
          fallaron: >-
            {{ localpkg_build.results | default([]) | rejectattr('rc', 'equalto', 0)
               | map(attribute='item.item') | list }}
          que_hacer: >-
            Para ver el error completo, en la maquina:
            cd /tmp/ciber-pkg-<nombre> && makepkg -si
            (ese directorio se borra al final de cada corrida, vuelve a copiarlo
            desde {{ local_packages_dir }}/ del repo)
      when: localpkg_build.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length > 0

  always:
    - name: Retirar el permiso NOPASSWD
      ansible.builtin.file:
        path: /etc/sudoers.d/99-ciber-aur
        state: absent
      become: true

    - name: Limpiar el directorio de compilacion
      ansible.builtin.file:
        path: /tmp/ciber-build-yay
        state: absent
      become: false

    - name: Limpiar los directorios de compilacion de los PKGBUILD
      ansible.builtin.file:
        path: "/tmp/ciber-pkg-{{ item }}"
        state: absent
      loop: "{{ local_packages }}"
      become: false
