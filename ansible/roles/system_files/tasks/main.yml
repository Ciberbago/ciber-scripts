---
# Archivos de configuracion de sistema (/etc, /boot, /usr/lib).
#
# Los archivos vienen del repo clonado, NO de URLs. Esto elimina la causa raiz
# de la mitad de los bugs del script de bash: 'wget -O' truncaba el destino
# antes de saber si la descarga sirvio, asi que un typo en la URL (o en el
# nombre de la variable, como el famoso ${sdcondfig}) dejaba un archivo de 0
# bytes y algo se rompia 40 lineas despues sin decir por que.
#
# Con 'copy' el archivo o existe en el repo o la tarea falla en el momento,
# senalando exactamente cual falta.

- name: Comprobar que los archivos de sistema existen en el repo
  ansible.builtin.stat:
    path: "{{ ciber_repo_root }}/{{ item.src }}"
  loop: "{{ system_files }}"
  loop_control:
    label: "{{ item.src }}"
  register: sysfiles_stat
  become: false

- name: Fallar con la lista de archivos que faltan
  ansible.builtin.assert:
    that: sysfiles_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Faltan estos archivos en el repo:
      {{ sysfiles_stat.results | rejectattr('stat.exists')
         | map(attribute='item.src') | list | join(', ') }}
    quiet: true

- name: Instalar archivos de configuracion de sistema
  ansible.builtin.copy:
    src: "{{ ciber_repo_root }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    # Configuracion, no ejecutables. El script viejo ponia 0755 en las entradas
    # de systemd-boot, que no tiene sentido para un archivo de texto.
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ system_files }}"
  loop_control:
    label: "{{ item.dest }}"
  become: true
  notify: Recargar sysctl

# --- Entradas de systemd-boot ---
#
# Todo este bloque esta detras de boot_entries_enabled, que viene en false. El
# modo de fallo es "la maquina no arranca", asi que se activa a mano por maquina.
#
# Los archivos originales del repo tenian "root=PARTUUID=[UUIDDISCODELKERNELBUENO
# sudo blkid]" como recordatorio para editarlos a mano, y el script de bash los
# copiaba tal cual a /boot/loader/entries/.

- name: Entradas de systemd-boot
  when: boot_entries_enabled
  block:
    - name: Exigir una entrada default declarada
      # Sin 'default' en loader.conf, agregar entradas Type #1 deja el arranque
      # al orden de sorteo de systemd-boot. Si vamos a agregar entradas, el
      # default tiene que ser explicito.
      ansible.builtin.assert:
        that: boot_default_entry | length > 0
        fail_msg: >-
          boot_entries_enabled es true pero boot_default_entry esta vacio.
          Pon el id de una entrada que sepas que arranca (velos con 'bootctl list').
        quiet: true

    - name: Comprobar que existe /boot/loader/entries
      ansible.builtin.stat:
        path: /boot/loader/entries
      register: entries_dir
      become: true

    - name: Avisar si no hay carpeta de entradas
      ansible.builtin.debug:
        msg: >-
          /boot/loader/entries no existe: se omiten las entradas. Si tu ESP no
          esta en /boot, ajusta las rutas en files.yml -> system_templates.
      when: not entries_dir.stat.exists

    - name: Escribir las entradas
      when: entries_dir.stat.exists
      block:
        - name: Detectar el dispositivo de la particion root
          ansible.builtin.command:
            cmd: findmnt --noheadings --output SOURCE --target /
          register: root_source
          changed_when: false

        - name: Detectar el PARTUUID de root
          ansible.builtin.command:
            cmd: "blkid -s PARTUUID -o value {{ root_source.stdout | trim }}"
          register: root_partuuid
          changed_when: false
          become: true

        - name: Detectar el sistema de archivos de root
          ansible.builtin.command:
            cmd: findmnt --noheadings --output FSTYPE --target /
          register: root_fstype
          changed_when: false

        - name: Buscar la imagen de microcodigo del CPU
          ansible.builtin.find:
            paths: /boot
            patterns: "*-ucode.img"
            recurse: false
          register: ucode_img
          become: true

        - name: Guardar los datos detectados
          ansible.builtin.set_fact:
            ciber_root_partuuid: "{{ root_partuuid.stdout | trim }}"
            ciber_root_fstype: "{{ root_fstype.stdout | trim }}"
            ciber_ucode_initrd: >-
              {{ ucode_img.files | map(attribute='path') | map('basename')
                 | sort | first | default('', true) }}

        - name: Comprobar que se detecto lo necesario
          ansible.builtin.assert:
            that:
              - ciber_root_partuuid | length > 0
              - ciber_root_fstype | length > 0
            fail_msg: >-
              No se pudo detectar el PARTUUID o el fstype de root
              ({{ root_source.stdout | trim }}). Si tu root esta en LVM o LUKS,
              escribe las entradas a mano y deja boot_entries_enabled en false.
            quiet: true

        - name: Comprobar que los kernels referenciados existen
          # Escribir una entrada que apunta a un vmlinuz inexistente es la forma
          # mas rapida de tener un menu de arranque roto.
          ansible.builtin.stat:
            path: "/boot/vmlinuz-{{ item }}"
          loop: [linux-cachyos, linux-lts]
          register: kernels_stat

        - name: Mostrar lo detectado
          ansible.builtin.debug:
            msg:
              dispositivo: "{{ root_source.stdout | trim }}"
              partuuid: "{{ ciber_root_partuuid }}"
              fstype: "{{ ciber_root_fstype }}"
              microcodigo: "{{ ciber_ucode_initrd | default('(ninguno)', true) }}"
              kernels_presentes: >-
                {{ kernels_stat.results | selectattr('stat.exists')
                   | map(attribute='item') | list }}
              kernels_faltantes: >-
                {{ kernels_stat.results | rejectattr('stat.exists')
                   | map(attribute='item') | list }}

        - name: Fijar la entrada default de systemd-boot
          ansible.builtin.lineinfile:
            path: /boot/loader/loader.conf
            regexp: '^#?\s*default\s'
            line: "default {{ boot_default_entry }}"
            insertbefore: BOF
          become: true

        - name: Escribir las entradas de systemd-boot
          ansible.builtin.template:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ system_templates }}"
          loop_control:
            label: "{{ item.dest }}"
          become: true
