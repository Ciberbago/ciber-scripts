---
# Archivos de configuracion de sistema (/etc, /boot, /usr/lib).
#
# Los archivos vienen del repo clonado, NO de URLs. Esto elimina la causa raiz
# de la mitad de los bugs del script de bash: 'wget -O' truncaba el destino
# antes de saber si la descarga sirvio, asi que un typo en la URL (o en el
# nombre de la variable, como el famoso ${sdcondfig}) dejaba un archivo de 0
# bytes y algo se rompia 40 lineas despues sin decir por que.
#
# Con 'copy' el archivo o existe en el repo o la tarea falla en el momento,
# senalando exactamente cual falta.

- name: Comprobar que los archivos de sistema existen en el repo
  ansible.builtin.stat:
    path: "{{ ciber_repo_root }}/{{ item.src }}"
  loop: "{{ system_files }}"
  loop_control:
    label: "{{ item.src }}"
  register: sysfiles_stat
  become: false

- name: Fallar con la lista de archivos que faltan
  ansible.builtin.assert:
    that: sysfiles_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Faltan estos archivos en el repo:
      {{ sysfiles_stat.results | rejectattr('stat.exists')
         | map(attribute='item.src') | list | join(', ') }}
    quiet: true

- name: Instalar archivos de configuracion de sistema
  ansible.builtin.copy:
    src: "{{ ciber_repo_root }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    # Configuracion, no ejecutables. El script viejo ponia 0755 en las entradas
    # de systemd-boot, que no tiene sentido para un archivo de texto.
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ system_files }}"
  loop_control:
    label: "{{ item.dest }}"
  become: true
  notify: Recargar sysctl

# --- Entradas de systemd-boot (llevan el PARTUUID de esta maquina) ---

- name: Detectar el dispositivo de la particion root
  ansible.builtin.command:
    cmd: findmnt --noheadings --output SOURCE --target /
  register: root_source
  changed_when: false

- name: Detectar el PARTUUID de root
  ansible.builtin.command:
    cmd: "blkid -s PARTUUID -o value {{ root_source.stdout | trim }}"
  register: root_partuuid
  changed_when: false
  become: true

- name: Detectar el sistema de archivos de root
  ansible.builtin.command:
    cmd: findmnt --noheadings --output FSTYPE --target /
  register: root_fstype
  changed_when: false

- name: Guardar los datos de root
  ansible.builtin.set_fact:
    ciber_root_partuuid: "{{ root_partuuid.stdout | trim }}"
    ciber_root_fstype: "{{ root_fstype.stdout | trim }}"

- name: Comprobar que se detecto el PARTUUID
  # Sin esto la entrada de boot quedaria con "root=PARTUUID=" vacio, que es
  # exactamente el problema que veniamos a arreglar pero mas silencioso.
  ansible.builtin.assert:
    that:
      - ciber_root_partuuid | length > 0
      - ciber_root_fstype | length > 0
    fail_msg: >-
      No se pudo detectar el PARTUUID o el fstype de la particion root
      ({{ root_source.stdout | trim }}). Si tu root esta en LVM o LUKS, las
      entradas de systemd-boot hay que escribirlas a mano: quita
      system_templates de files.yml.
    quiet: true

- name: Mostrar los datos detectados de root
  ansible.builtin.debug:
    msg:
      dispositivo: "{{ root_source.stdout | trim }}"
      partuuid: "{{ ciber_root_partuuid }}"
      fstype: "{{ ciber_root_fstype }}"

- name: Ver si se usa systemd-boot
  ansible.builtin.stat:
    path: "{{ item.requires_dir }}"
  loop: "{{ system_templates }}"
  loop_control:
    label: "{{ item.requires_dir }}"
  register: boot_dirs
  become: true

- name: Escribir las entradas de systemd-boot
  ansible.builtin.template:
    src: "{{ item.item.src }}"
    dest: "{{ item.item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ boot_dirs.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.dest }}"
  become: true

- name: Avisar si no se uso systemd-boot
  ansible.builtin.debug:
    msg: >-
      No existe {{ boot_dirs.results | rejectattr('stat.exists')
        | map(attribute='item.requires_dir') | unique | join(', ') }}:
      se omitieron las entradas de boot (no usas systemd-boot).
  when: boot_dirs.results | rejectattr('stat.exists') | list | length > 0
