---
# =============================================================================
#  Playbook de sistema. Se puede correr sin sesion grafica (recien instalado).
#
#  Todo lo que necesita GNOME corriendo (dconf, gsettings, extensiones) esta en
#  session.yml, que se ejecuta con el comando 'ciber-session' despues del primer
#  login. No es un detalle de estilo: dconf y gsettings hablan por DBus con la
#  sesion del usuario, y en un sistema recien instalado esa sesion no existe.
# =============================================================================
- name: Configuracion de Arch Linux
  hosts: workstations_arch
  gather_facts: true

  pre_tasks:
    - name: Comprobar que estamos en Arch
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Archlinux'
        fail_msg: >-
          Este playbook es para Arch Linux, no para
          {{ ansible_facts.distribution }}.
        quiet: true
      tags: always

    - name: Avisar si no hay interfaz de red default
      ansible.builtin.debug:
        msg: >-
          No se detecto interfaz de red default: las unidades wol@ se omitiran.
      when: ciber_default_iface | length == 0
      tags: always

  roles:
    - { role: pacman_setup,     tags: [pacman, base] }
    - { role: packages,         tags: [packages] }
    # Despues de packages: necesita que existan el grupo vboxusers y el binario
    # de fish, que los crean sus paquetes.
    - { role: user_setup,       tags: [user, base] }
    - { role: system_files,     tags: [files, system] }
    # Antes de systemd_units: la unidad del NAS necesita el archivo de
    # credenciales, y este rol lo crea con valores de ejemplo si no existe.
    - { role: credentials,      tags: [credentials, base] }
    - { role: systemd_units,    tags: [systemd] }
    - { role: cli_tools,        tags: [files, tools] }
    - { role: dotfiles,         tags: [files, dotfiles] }
    - { role: shell_fish,       tags: [shell, fish] }
    - { role: aur,              tags: [aur] }
    # Despues de 'aur': genera una entrada por kernel de /boot, y linux-cachyos
    # lo instala 'aur' desde chaotic. Antes de aur, ese kernel no existe todavia.
    - { role: boot_entries,     tags: [boot, system] }
    - { role: pkg_cleanup,      tags: [cleanup] }
    # appimages y hide_apps NO van aqui: viven en session.yml porque tocan la
    # rejilla de aplicaciones de GNOME y necesitan la sesion abierta. En el
    # flujo original de bash tambien corrian despues del login, desde
    # postinstall.sh.

  post_tasks:
    - name: Resumen
      ansible.builtin.debug:
        msg:
          - "Sistema configurado."
          - "Reinicia y entra a GNOME."
          - "Luego ejecuta: ciber-session  (ahi van AppImages, GNOME y Firefox)"
      tags: always

    # Se repite aqui, al final, aunque el rol ya lo dijo. Un aviso a la mitad de
    # una corrida de 8 minutos se pierde entre las demas tareas, y esto es lo
    # unico que el playbook NO puede resolver solo.
    - name: FALTA POR HACER A MANO - credenciales
      ansible.builtin.debug:
        # msg como lista YAML de verdad, no como una expresion Jinja que
        # devuelva una lista: sin jinja2_native el resultado se convierte a
        # texto y saldria el repr de Python, con corchetes y comillas.
        msg:
          - "*** ACCION REQUERIDA ***"
          - "Todavia tienen CAMBIAME:"
          - "{{ credenciales_pendientes | default([]) | map(attribute='dest') | join(', ') }}"
          - "Editalos con los datos reales. Mientras no lo hagas, lo que"
          - "depende de ellos no funciona (el NAS no se monta)."
      when: credenciales_pendientes | default([]) | length > 0
      tags: always
