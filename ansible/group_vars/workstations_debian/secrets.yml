---
# =============================================================================
#  SECRETOS  -  que archivos de entorno existen, NUNCA sus valores
# =============================================================================
#
#  Aqui solo se declara QUE archivos deben existir y QUE claves llevan. Los
#  valores se escriben a mano una vez por maquina y Ansible no los toca jamas
#  (la tarea usa force: false).
#
#  Regla: si un valor no puede aparecer en un repositorio publico, no se escribe
#  en este archivo ni en ningun script. Va en el .env de la maquina.
#
#  Por que no ansible-vault: obligaria a teclear la contrasena del vault en CADA
#  ciber-apply, o a guardarla en un archivo, que es el mismo problema movido de
#  sitio. Para un secreto que se pone una vez por servidor y no cambia, no
#  compensa.
# =============================================================================

# --- Los que lee una unidad de SISTEMA (root) ---
env_files_system:
  - path: /etc/ciber/backup.env
    descripcion: Credenciales del bot de Telegram que usa el respaldo diario
    consumido_por: /usr/local/bin/backup.sh (backup.service)
    claves:
      - TELEGRAM_TOKEN
      - TELEGRAM_CHAT_ID

# --- Los que lee una unidad de USUARIO ---
# Van en el HOME porque todoist-precise.service corre como el usuario y no
# podria leer un archivo 0600 propiedad de root.
env_files_user:
  - path: ~/.config/ciber/todoist.env
    descripcion: Tokens de Todoist y Telegram para el notificador de tareas
    consumido_por: /usr/local/bin/todoist.sh (todoist-precise.service)
    claves:
      - TODOIST_TOKEN
      - TELEGRAM_TOKEN
      - TELEGRAM_CHAT_ID
