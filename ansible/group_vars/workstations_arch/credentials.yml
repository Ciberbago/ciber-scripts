---
# =============================================================================
#  CREDENCIALES  -  secretos que NO pueden vivir en el repo
# =============================================================================
#
#  El rol crea cada archivo con valores de ejemplo si no existe, con permisos
#  0600, y NUNCA lo sobrescribe si ya esta. Mientras siga diciendo CAMBIAME:
#
#    - el playbook lo avisa al final de cada 'ciber-apply'
#    - y si la unidad que lo usa falla, systemd dispara un aviso al escritorio
#
#  Para agregar otro secreto basta una entrada aqui. No se toca codigo.
# =============================================================================

credential_files:
  - dest: "{{ ciber_home }}/.credentials"
    desc: "NAS por CIFS (//192.168.7.210/nas)"
    pista: >-
      Es el usuario y contrasena del recurso samba, no los de esta maquina.
      Despues de rellenarlo: sudo systemctl restart run-media-nas.automount
    # OJO: sin comentarios dentro del archivo. mount.cifs lee este archivo
    # buscando las claves username/password/domain, y no esta documentado que
    # tolere lineas de comentario. Un comentario que rompa el parseo dejaria el
    # montaje fallando por una razon todavia mas dificil de encontrar que la
    # que este mecanismo viene a resolver.
    contenido: |
      username=CAMBIAME
      password=CAMBIAME
