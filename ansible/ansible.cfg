[defaults]
inventory            = inventory.ini
roles_path           = roles
interpreter_python   = /usr/bin/python3

# El callback 'community.general.yaml' se elimino en community.general 12.0.0.
# Su reemplazo es el callback 'default' de ansible-core con result_format=yaml.
stdout_callback      = default
result_format        = yaml

display_skipped_hosts = false
force_color           = true
retry_files_enabled   = false

[privilege_escalation]
become        = false
become_method = sudo
