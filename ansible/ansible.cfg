[defaults]
inventory            = inventory.ini
roles_path           = roles
interpreter_python   = /usr/bin/python3

# El callback 'community.general.yaml' se elimino en community.general 12.0.0.
# Su reemplazo es el callback 'default' de ansible-core con result_format=yaml.
stdout_callback      = default
result_format        = yaml

# profile_tasks imprime hora, duracion de cada tarea y acumulado, y al final el
# ranking de las mas lentas. No transmite la salida de los modulos (Ansible no
# puede hacer eso), pero al menos ves el ritmo y en que paso va.
callbacks_enabled     = ansible.posix.profile_tasks

display_skipped_hosts = false
force_color           = true
retry_files_enabled   = false

[privilege_escalation]
become        = false
become_method = sudo
