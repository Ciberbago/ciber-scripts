# Inventario de Debian. Va en un archivo APARTE del de Arch, y no es una mania:
#
# Al principio los dos grupos convivian en inventory.ini. Parecia inofensivo
# porque cada playbook declara 'hosts: workstations_arch' o
# 'hosts: workstations_debian'... pero Ansible no fusiona las variables por
# PLAY, sino por HOST. Con 'localhost' en los dos grupos, heredaba
# group_vars/workstations_arch/ Y group_vars/workstations_debian/ a la vez, y
# cuando dos grupos del mismo nivel definen la misma variable gana el ultimo por
# orden alfabetico: workstations_debian.
#
# Resultado real en una VM de Arch: el rol systemd_units leyo el
# systemd_units_enabled de Debian y habilito backup.timer, docker.service y
# containerd.service; systemd_units_dir quedo en 'systemd/debian' y copio las
# unidades de Debian a /etc/systemd/system. La corrida murio al intentar
# arrancar docker.service, que en esa maquina no estaba configurado.
#
# Con dos archivos, cada 'localhost' pertenece a un solo grupo y la fusion no
# tiene de donde cruzarse.
[workstations_debian]
localhost ansible_connection=local
